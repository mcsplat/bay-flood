version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # One PR per month for minor/patch bumps instead of a dozen.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Major upgrades (Next.js, TypeScript, ESLint…) need deliberate migration; do them by hand.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

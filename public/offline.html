<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b2540" />
    <title>Offline · Bay Flood Watch</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
        background: linear-gradient(160deg, #0b2540, #0c4a6e);
        color: #f0f9ff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        text-align: center;
      }
      main {
        max-width: 360px;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
      }
      h1 {
        font-size: 22px;
        margin: 20px 0 8px;
      }
      p {
        color: #bae6fd;
        line-height: 1.5;
        margin: 0 0 12px;
      }
      .safety {
        margin-top: 20px;
        padding: 12px 14px;
        border-radius: 12px;
        background: rgb(255 255 255 / 0.08);
        color: #f0f9ff;
        font-size: 14px;
        text-align: left;
      }
      button {
        margin-top: 20px;
        padding: 10px 18px;
        border: 0;
        border-radius: 10px;
        background: #38bdf8;
        color: #0b2540;
        font-weight: 600;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Bay Flood Watch can't reach the network right now. It will refresh automatically when you're back online.</p>
      <div class="safety">
        <strong>If you're in danger, call 911.</strong><br />
        Never drive or walk into flood water, and follow evacuation orders from local officials.
      </div>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
